plugins {
    id 'com.android.application'
}

// A sideload-only TV app, so the signature only has to be *stable*, never secret: every build from
// this repo — on your machine and in CI — signs with the committed keystore in keystore/, so an
// update installs straight over the previous one. Point LIGHTHOUSE_KEYSTORE at your own keystore if
// you would rather publish under your own identity.
def defaultKey = rootProject.file('keystore/sideload.jks')
def keyPath = System.getenv('LIGHTHOUSE_KEYSTORE')
def keyFile = keyPath != null ? file(keyPath) : defaultKey
def hasKey = keyFile.exists()

android {
    namespace 'tv.lighthouse.launcher'
    compileSdk 34

    signingConfigs {
        tv {
            if (hasKey) {
                storeFile keyFile
                storePassword System.getenv('LIGHTHOUSE_STORE_PASSWORD') ?: 'lighthouse'
                keyAlias System.getenv('LIGHTHOUSE_KEY_ALIAS') ?: 'sideload'
                keyPassword System.getenv('LIGHTHOUSE_KEY_PASSWORD') ?: 'lighthouse'
            }
        }
    }

    defaultConfig {
        applicationId 'tv.lighthouse.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Falls back to the debug key only if the keystore is missing, so a fresh clone without
            // the file still builds.
            signingConfig hasKey ? signingConfigs.tv : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
